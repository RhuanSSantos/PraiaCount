<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏖️ Nois vai pra praia!</title>
    <style>

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px 100px;
            position: relative;
        }

        /* ===================== SLIDESHOW DE FOTOS ===================== */
        /*
         * 📸 PARA ADICIONAR AS FOTOS DEPOIS:
         *    1. Coloque os arquivos na pasta /fotos/
         *    2. Nomeie como: amigo1.jpg, amigo2.jpg, etc.
         *       (pode ser .jpg, .jpeg, .png ou .webp)
         *    3. Atualize a lista de fotos no JavaScript abaixo (array FOTOS)
         *    4. Delete os placeholders .svg da pasta /fotos/
         */

        .slideshow {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .slide {
            position: absolute;
            inset: 0;
            background-size: 60%;
            background-position: center;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .slide.active { opacity: 1; }

        /* Overlay escuro sobre as fotos para o texto aparecer bem */
        .slideshow::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0,0,0,.55) 0%,
                rgba(0,0,0,.35) 40%,
                rgba(0,0,50,.6) 75%,
                rgba(0,0,80,.85) 100%
            );
            z-index: 1;
        }

        /* ===================== DECORAÇÕES ===================== */

        .sun {
            position: fixed;
            top: -30px;
            right: 60px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, #fef08a 30%, #fbbf24 70%, #f59e0b 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px 20px rgba(251,191,36,.45), 0 0 120px 40px rgba(251,191,36,.2);
            animation: pulse-sun 3s ease-in-out infinite;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes pulse-sun {
            0%,100% { box-shadow: 0 0 60px 20px rgba(251,191,36,.45), 0 0 120px 40px rgba(251,191,36,.2); }
            50%      { box-shadow: 0 0 80px 30px rgba(251,191,36,.6),  0 0 160px 60px rgba(251,191,36,.3); }
        }

        .waves-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 300%;
            height: 100%;
        }

        .wave-1 { animation: wave-move 6s linear infinite; }
        .wave-2 { animation: wave-move 9s linear infinite reverse; opacity:.6; }
        .wave-3 { animation: wave-move 12s linear infinite 2s; opacity:.4; }

        @keyframes wave-move {
            0%   { transform: translateX(0); }
            100% { transform: translateX(33.33%); }
        }

        .palm-left, .palm-right {
            position: fixed;
            bottom: 70px;
            font-size: clamp(4rem, 10vw, 7rem);
            z-index: 3;
            pointer-events: none;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,.4));
        }

        .palm-left  { left: -6px;  transform: scaleX(-1) rotate(-8deg); }
        .palm-right { right: -6px; transform: rotate(8deg); }

        /* ===================== CONTEÚDO ===================== */

        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            text-align: center;
        }

        /* ===================== TÍTULO PRINCIPAL ===================== */

        .emoji-top {
            font-size: clamp(2.5rem, 8vw, 4rem);
            animation: bob 2.5s ease-in-out infinite;
            display: block;
        }

        @keyframes bob {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        .title-main {
            font-size: clamp(1.6rem, 5.5vw, 2.8rem);
            font-weight: 900;
            line-height: 1.2;
            text-shadow: 0 3px 16px rgba(0,0,0,.5);
        }

        .title-main .destaque {
            color: #fef08a;
        }

        .subtitle-geral {
            font-size: clamp(.9rem, 2.5vw, 1.05rem);
            color: rgba(255,255,255,.75);
            font-weight: 400;
        }

        /* ===================== DATA ALVO ===================== */

        .target-badge {
            background: rgba(255,255,255,.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 50px;
            padding: 9px 22px;
            font-size: .88rem;
            font-weight: 700;
            letter-spacing: .03em;
        }

        /* ===================== CONTADOR ===================== */

        .countdown-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .count-card {
            background: rgba(255,255,255,.12);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 20px;
            padding: 22px 10px 16px;
            min-width: 100px;
            flex: 1;
            max-width: 160px;
        }

        .count-number {
            font-size: clamp(2.6rem, 7vw, 4.5rem);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 2px 16px rgba(0,0,0,.3);
            display: block;
        }

        .count-number.flip { animation: flip-in .25s ease; }

        @keyframes flip-in {
            0%   { transform: translateY(-12px); opacity: 0; }
            100% { transform: translateY(0);     opacity: 1; }
        }

        .count-label {
            margin-top: 7px;
            font-size: .75rem;
            font-weight: 700;
            color: rgba(255,255,255,.65);
            text-transform: uppercase;
            letter-spacing: .1em;
        }

        .colon {
            font-size: 2.8rem;
            font-weight: 900;
            color: rgba(255,255,255,.5);
            width: 24px;
            text-align: center;
            margin-top: -16px;
            animation: blink-colon 1s step-end infinite;
            flex-shrink: 0;
        }

        @keyframes blink-colon {
            0%,100% { opacity:1; }
            50%      { opacity:.15; }
        }

        /* ===================== BARRA DE PROGRESSO ===================== */

        .progress-section {
            width: 100%;
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 18px;
            padding: 18px 22px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: .78rem;
            color: rgba(255,255,255,.7);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,.15);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #fef08a, #fbbf24, #f59e0b);
            border-radius: 999px;
            transition: width 1s ease;
            box-shadow: 0 0 10px rgba(251,191,36,.5);
        }

        /* ===================== MENSAGEM DE ZOEIRA ===================== */

        .zoeira-box {
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 18px;
            padding: 18px 24px;
            width: 100%;
            font-size: clamp(.85rem, 2.5vw, 1rem);
            line-height: 1.7;
        }

        .zoeira-box strong { color: #fef08a; }

        /* ===================== INDICADOR DE SLIDE ===================== */

        .slide-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,.3);
            border: 1px solid rgba(255,255,255,.5);
            cursor: pointer;
            transition: background .3s, transform .3s;
        }

        .dot.active {
            background: #fbbf24;
            transform: scale(1.3);
        }

        /* ===================== CHEGOU O DIA ===================== */

        .arrived {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .arrived-emoji {
            font-size: 5rem;
            animation: bounce-big 1s ease-in-out infinite;
        }

        @keyframes bounce-big {
            0%,100% { transform: translateY(0) rotate(-5deg); }
            50%      { transform: translateY(-20px) rotate(5deg); }
        }

        .arrived h2 {
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            font-weight: 900;
            text-shadow: 0 4px 20px rgba(0,0,0,.3);
        }

        .arrived p { color: rgba(255,255,255,.8); font-size: 1.05rem; }

        /* ===================== RODAPÉ ===================== */

        .footer {
            font-size: .7rem;
            color: rgba(255,255,255,.35);
        }

        /* ===================== RESPONSIVO ===================== */

        @media (max-width: 520px) {
            .colon { display: none; }
            .countdown-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
            .count-card { max-width: 100%; }
            .palm-left, .palm-right { display: none; }
        }

    </style>
</head>
<body>

    <!-- ===== SLIDESHOW DE FOTOS ===== -->
    <div class="slideshow" id="slideshow"></div>

    <!-- ===== DECORAÇÕES ===== -->
    <div class="sun"></div>
    <div class="palm-left">🌴</div>
    <div class="palm-right">🌴</div>

    <div class="waves-wrap">
        <svg class="wave wave-1" viewBox="0 0 1200 140" preserveAspectRatio="none">
            <path d="M0,70 C150,20 350,120 600,70 C850,20 1050,120 1200,70 L1200,140 L0,140 Z" fill="rgba(14,165,233,.5)"/>
        </svg>
        <svg class="wave wave-2" viewBox="0 0 1200 140" preserveAspectRatio="none">
            <path d="M0,90 C200,40 400,140 600,90 C800,40 1000,140 1200,90 L1200,140 L0,140 Z" fill="rgba(7,89,133,.4)"/>
        </svg>
        <svg class="wave wave-3" viewBox="0 0 1200 140" preserveAspectRatio="none">
            <path d="M0,110 C250,60 450,140 700,100 C900,55 1100,135 1200,110 L1200,140 L0,140 Z" fill="rgba(3,55,90,.45)"/>
        </svg>
    </div>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <div class="wrapper">

        <span class="emoji-top">🏖️</span>

        <h1 class="title-main">
            Falta pouco pra nois i pra praia, <span class="destaque">só:</span>
        </h1>

        <p class="subtitle-geral">
            Boa pra quem tá ansioso e apressado 😄
        </p>

        <div class="target-badge">
            📅 &nbsp;23 de outubro de 2026
        </div>

        <!-- Contador -->
        <div class="countdown-wrap" id="countdown-wrap">

            <div class="count-card">
                <span class="count-number" id="dias">--</span>
                <div class="count-label">Dias</div>
            </div>

            <span class="colon">:</span>

            <div class="count-card">
                <span class="count-number" id="horas">--</span>
                <div class="count-label">Horas</div>
            </div>

            <span class="colon">:</span>

            <div class="count-card">
                <span class="count-number" id="minutos">--</span>
                <div class="count-label">Minutos</div>
            </div>

            <span class="colon">:</span>

            <div class="count-card">
                <span class="count-number" id="segundos">--</span>
                <div class="count-label">Segundos</div>
            </div>

        </div>

        <!-- Barra de progresso -->
        <div class="progress-section" id="progress-section">
            <div class="progress-label">
                <span>🌊 Quanto falta ainda</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
            </div>
        </div>

        <!-- Mensagem de zoeira -->
        <div class="zoeira-box" id="zoeira-box">
            <span id="zoeira-text">Calculando a zoeira...</span>
        </div>

        <!-- Indicador de fotos -->
        <div class="slide-dots" id="slide-dots"></div>

        <!-- Chegou o dia -->
        <div class="arrived" id="arrived">
            <span class="arrived-emoji">🎉</span>
            <h2>É HOJE RAPAZIADA!! 🏄‍♂️🌊</h2>
            <p>Vamos e vamos! Bora pro mar! 🍹☀️🔥</p>
        </div>

        <div class="footer">Rhuan Santos 2026®</div>

    </div>

    <script>

       

        const FOTOS = [
            "fotos/amigo1.png",
            "fotos/amigo2.png",
            "fotos/amigo3.png",
            "fotos/amigo4.png"
        ];

        const NOMES = [];

        /* =====================================================================
         * INTERVALO ENTRE FOTOS (em milissegundos)
         * 4000 = 4 segundos. Mude aqui se quiser mais rápido ou mais devagar.
         * ===================================================================== */
        const SLIDE_INTERVAL = 4000;

        /* =====================================================================
         * DATA ALVO
         * ===================================================================== */
        const TARGET = new Date(2026, 9, 23, 0, 0, 0);
        const START  = new Date(2026, 0, 1);

    
        const mensagens = [
            d => `Calma aí, apressado! Ainda faltam <strong>${d} dias</strong>. Vai separando a sunga! 🩱`,
            d => `<strong>${d} dias</strong> e nois vai tá escutando o barulho das onda! 🌊🔊`,
            d => `Faltam <strong>${d} dias</strong> pra nois tomar mansão maromba na beira do mar! 💪🍹`,
            d => `<strong>${d} dias</strong>. Já pode ir comprando o protetor solar seus apressado! 🧴😂`,
            d => `Em <strong>${d} dias</strong> a galera vai tá na faixa! Aguenta o tranco! 🏖️`,
            d => d <= 30
                ? `MENOS DE UM MÊS! <strong>${d} dias</strong>! Já tá chegando rapaziada! 🔥🔥🔥`
                : `<strong>${d} dias</strong> — vai passando rápido, confia no processo! 😎`,
            d => d <= 7
                ? `<strong>${d} DIAS</strong>! QUE SEMANA DOIDA VAI SER! BORA! 🚀🏄`
                : `Relaxa que em <strong>${d} dias</strong> a zoeira começa! ⏳🤙`,
            d => `PP da VS e Mansão maromba, vambora! 🏠💪🌊`
        ];

        /* =====================================================================
         * SLIDESHOW
         * ===================================================================== */

        const slideshowEl = document.getElementById("slideshow");
        const dotsEl      = document.getElementById("slide-dots");
        let currentSlide  = 0;
        let slideTimer    = null;

        function buildSlideshow() {

            slideshowEl.innerHTML = "";
            dotsEl.innerHTML      = "";

            FOTOS.forEach((src, i) => {

                // Slide
                const div = document.createElement("div");
                div.className = "slide" + (i === 0 ? " active" : "");
                div.style.backgroundImage = `url('${src}')`;
                
                slideshowEl.appendChild(div);

                // Dot
                const dot = document.createElement("div");
                dot.className = "dot" + (i === 0 ? " active" : "");
                dot.addEventListener("click", () => goToSlide(i));
                dotsEl.appendChild(dot);

            });

        }

        function goToSlide(n) {

            const slides = slideshowEl.querySelectorAll(".slide");
            const dots   = dotsEl.querySelectorAll(".dot");

            slides[currentSlide].classList.remove("active");
            dots[currentSlide].classList.remove("active");

            currentSlide = (n + FOTOS.length) % FOTOS.length;

            slides[currentSlide].classList.add("active");
            dots[currentSlide].classList.add("active");

        }

        function nextSlide() { goToSlide(currentSlide + 1); }

        function startSlideshow() {

            buildSlideshow();
            if (FOTOS.length > 1) {
                slideTimer = setInterval(nextSlide, SLIDE_INTERVAL);
            }

        }

        /* =====================================================================
         * CONTADOR
         * ===================================================================== */

        const elDias    = document.getElementById("dias");
        const elHoras   = document.getElementById("horas");
        const elMin     = document.getElementById("minutos");
        const elSeg     = document.getElementById("segundos");
        const elBar     = document.getElementById("progress-bar");
        const elPct     = document.getElementById("progress-pct");
        const elZoeira  = document.getElementById("zoeira-text");
        const elArrived = document.getElementById("arrived");

        let lastVals = {};

        function pad(n) { return String(n).padStart(2, "0"); }

        function setEl(el, val) {
            if (lastVals[el.id] === val) return;
            el.textContent = val;
            el.classList.remove("flip");
            void el.offsetWidth;
            el.classList.add("flip");
            lastVals[el.id] = val;
        }

        function tick() {

            const now  = new Date();
            const diff = TARGET - now;

            if (diff <= 0) {
                document.getElementById("countdown-wrap").style.display  = "none";
                document.getElementById("progress-section").style.display = "none";
                document.getElementById("zoeira-box").style.display       = "none";
                elArrived.style.display = "flex";
                return;
            }

            const dias    = Math.floor(diff / 86400000);
            const horas   = Math.floor((diff % 86400000) / 3600000);
            const minutos = Math.floor((diff % 3600000)  / 60000);
            const segs    = Math.floor((diff % 60000)    / 1000);

            setEl(elDias,  pad(dias));
            setEl(elHoras, pad(horas));
            setEl(elMin,   pad(minutos));
            setEl(elSeg,   pad(segs));

            // Progresso
            const pct    = Math.min(100, Math.max(0, ((now - START) / (TARGET - START)) * 100));
            const pctStr = pct.toFixed(1) + "%";
            elBar.style.width  = pctStr;
            elPct.textContent  = pctStr;

            // Mensagem de zoeira (rotaciona pelo dia)
            const fn = mensagens[dias % mensagens.length];
            elZoeira.innerHTML = fn(dias);

        }

        /* =====================================================================
         * INICIA
         * ===================================================================== */

        startSlideshow();
        tick();
        setInterval(tick, 1000);

    </script>

</body>
</html>
